# 示例文件，不参与 kustomization。
# 复制并替换后执行：
#   kubectl -n forum apply -f secret.example.yaml
#
# 生产环境请使用 AWS Secrets Manager + External Secrets / Sealed Secrets。
apiVersion: v1
kind: Secret
metadata:
  name: forum-secrets
  namespace: forum
  labels:
    app.kubernetes.io/part-of: forum
type: Opaque
stringData:
  FORUM_USER_DB_USERNAME: "REPLACE_ME"
  FORUM_USER_DB_PASSWORD: "REPLACE_ME"
  FORUM_CONTENT_DB_USERNAME: "REPLACE_ME"
  FORUM_CONTENT_DB_PASSWORD: "REPLACE_ME"
  FORUM_NOTIFICATION_DB_USERNAME: "REPLACE_ME"
  FORUM_NOTIFICATION_DB_PASSWORD: "REPLACE_ME"
  FORUM_MEDIA_DB_USERNAME: "REPLACE_ME"
  FORUM_MEDIA_DB_PASSWORD: "REPLACE_ME"

  FORUM_REDIS_PASSWORD: "REPLACE_ME"
  FORUM_RABBIT_PASSWORD: "REPLACE_ME"
  FORUM_MINIO_USERNAME: "minio"
  FORUM_MINIO_PASSWORD: "REPLACE_ME"

  FORUM_JWT_SECRET: "REPLACE_WITH_AT_LEAST_32_BYTES"
  FORUM_INTERNAL_TOKEN: "REPLACE_ME"

  FORUM_MAIL_USERNAME: "REPLACE_ME@example.com"
  FORUM_MAIL_PASSWORD: "REPLACE_ME"
  FORUM_WEATHER_KEY: "REPLACE_ME"
