apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-frontend
  namespace: forum
  labels:
    app.kubernetes.io/name: forum-frontend
    app.kubernetes.io/part-of: forum
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forum-frontend
        app.kubernetes.io/part-of: forum
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: frontend
          image: 18.183.238.1/forum/forum-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: forum-config
                  key: GATEWAY_UPSTREAM
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: forum-frontend
  namespace: forum
  labels:
    app.kubernetes.io/name: forum-frontend
    app.kubernetes.io/part-of: forum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forum-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
