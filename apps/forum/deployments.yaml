apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-gateway
  namespace: forum
  labels: { app: forum-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: forum-gateway }
  template:
    metadata:
      labels: { app: forum-gateway }
    spec:
      containers:
        - name: app
          image: 18.183.238.1/forum/forum-gateway:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: forum-config }
            - secretRef: { name: forum-secrets }
          env:
            - { name: SW_AGENT_NAME, value: forum-gateway }
            - { name: SERVER_PORT, value: "4433" }
            - { name: MANAGEMENT_PORT, value: "9080" }
          ports:
            - { name: http, containerPort: 4433 }
            - { name: management, containerPort: 9080 }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9080 }
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9080 }
            initialDelaySeconds: 150
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 800m, memory: 768Mi }
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: forum-gateway
  namespace: forum
spec:
  selector: { app: forum-gateway }
  ports:
    - { name: http, port: 4433, targetPort: 4433 }
    - { name: management, port: 9080, targetPort: 9080 }
---
