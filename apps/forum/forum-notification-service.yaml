apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-notification-service
  namespace: forum
  labels:
    app.kubernetes.io/name: forum-notification-service
    app.kubernetes.io/part-of: forum
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forum-notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forum-notification-service
        app.kubernetes.io/part-of: forum
    spec:
      imagePullSecrets:
        - name: harbor-registry
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: 18.183.238.1/forum/forum-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
            - name: management
              containerPort: 9084
          envFrom:
            - configMapRef:
                name: forum-config
            - secretRef:
                name: forum-secrets
          env:
            - name: SW_AGENT_NAME
              value: forum-notification-service
            - name: SW_AGENT_INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: forum-notification-service
  namespace: forum
  labels:
    app.kubernetes.io/name: forum-notification-service
    app.kubernetes.io/part-of: forum
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forum-notification-service
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: management
      port: 9084
      targetPort: management