apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forum
  namespace: forum
  labels:
    app.kubernetes.io/part-of: forum
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: forum.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: forum-gateway
                port:
                  number: 4433
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: forum-gateway
                port:
                  number: 4433
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forum-frontend
                port:
                  number: 80
