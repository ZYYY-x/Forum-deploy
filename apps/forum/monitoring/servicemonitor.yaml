apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forum-services
  namespace: forum
  labels:
    release: prometheus
    app.kubernetes.io/part-of: forum
spec:
  namespaceSelector:
    matchNames:
      - forum
  selector:
    matchLabels:
      tier: forum-backend
  jobLabel: app
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: application
