apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forum
  namespace: devops-tools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: forum
  source:
    repoURL: https://github.com/ZYYY-x/Forum-deploy.git
    targetRevision: main
    path: apps/forum
  destination:
    server: https://kubernetes.default.svc
    namespace: forum
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
