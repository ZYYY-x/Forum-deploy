apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: forum
  namespace: devops-tools
spec:
  description: "Forum microservices (dev / AWS k8s-master)"
  sourceRepos:
    - https://github.com/ZYYY-x/Forum-deploy.git
  destinations:
    - namespace: forum
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
