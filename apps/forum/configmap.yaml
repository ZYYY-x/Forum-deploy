apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-config
  namespace: forum
  labels:
    app.kubernetes.io/part-of: forum
data:
  # 中间件命名空间假设为 middleware；如实际命名不同请统一替换。
  NACOS_ENABLED: "true"
  NACOS_ADDR: "nacos.middleware.svc.cluster.local:8848"

  FORUM_REDIS_HOST: "redis.middleware.svc.cluster.local"
  FORUM_REDIS_PORT: "6379"
  FORUM_REDIS_DB: "0"

  FORUM_RABBIT_ADDR: "rabbitmq.middleware.svc.cluster.local"
  FORUM_RABBIT_USERNAME: "forum"

  FORUM_MINIO_ENDPOINT: "http://minio.middleware.svc.cluster.local:9000"

  # AWS RDS MySQL：把 REPLACE_RDS_ENDPOINT 改成实际 endpoint。
  FORUM_USER_DB_URL: "jdbc:mysql://REPLACE_RDS_ENDPOINT:3306/forum_user?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=utf8"
  FORUM_CONTENT_DB_URL: "jdbc:mysql://REPLACE_RDS_ENDPOINT:3306/forum_content?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=utf8"
  FORUM_NOTIFICATION_DB_URL: "jdbc:mysql://REPLACE_RDS_ENDPOINT:3306/forum_notification?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=utf8"
  FORUM_MEDIA_DB_URL: "jdbc:mysql://REPLACE_RDS_ENDPOINT:3306/forum_media?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=utf8"
  FORUM_DB_POOL_MAX: "10"

  FORUM_USER_URI: "lb://forum-user-service"
  FORUM_CONTENT_URI: "lb://forum-content-service"
  FORUM_NOTIFICATION_URI: "lb://forum-notification-service"
  FORUM_MEDIA_URI: "lb://forum-media-service"
  FORUM_WEATHER_URI: "lb://forum-weather-service"
  FORUM_USER_SERVICE_URL: ""

  FORUM_MAIL_HOST: "smtp.163.com"
  FORUM_MAIL_PORT: "465"

  SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap.middleware.svc.cluster.local:11800"

  # 前端 Nginx 的网关地址；Ingress 也直接把 /api、/images 转到网关。
  GATEWAY_UPSTREAM: "http://forum-gateway:4433"
