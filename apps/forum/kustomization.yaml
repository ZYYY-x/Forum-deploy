apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forum

resources:
  - namespace.yaml
  - configmap.yaml
  - forum-gateway.yaml
  - forum-user-service.yaml
  - forum-content-service.yaml
  - forum-notification-service.yaml
  - forum-media-service.yaml
  - forum-weather-service.yaml
  - forum-frontend.yaml
  - ingress.yaml

# Jenkins 在构建完成后更新这些 tag；Argo CD 检测到 Git 变化会自动同步。
# 生产建议使用不可变 tag，例如 build-123 或 git SHA。
images:
  - name: 18.183.238.1/forum/forum-gateway
    newTag: latest
  - name: 18.183.238.1/forum/forum-user-service
    newTag: latest
  - name: 18.183.238.1/forum/forum-content-service
    newTag: latest
  - name: 18.183.238.1/forum/forum-notification-service
    newTag: latest
  - name: 18.183.238.1/forum/forum-media-service
    newTag: latest
  - name: 18.183.238.1/forum/forum-weather-service
    newTag: latest
  - name: 18.183.238.1/forum/forum-frontend
    newTag: latest
