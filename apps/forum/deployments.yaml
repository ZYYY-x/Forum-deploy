apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-frontend
  namespace: forum
  labels: { app: forum-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: forum-frontend }
  template:
    metadata:
      labels: { app: forum-frontend }
    spec:
      containers:
        - name: web
          image: 18.183.238.1/forum/forum-frontend:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: GATEWAY_UPSTREAM, value: "http://forum-gateway:4433" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: forum-frontend
  namespace: forum
spec:
  selector: { app: forum-frontend }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
