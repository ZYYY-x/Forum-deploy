apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forum

resources:
  - namespace.yaml
  - configmap.yaml
  - deployments.yaml
  - httproute.yaml

# CI（Jenkins）构建完成后只更新这里的 tag，Argo CD 检测到 Git 变化自动同步。
# secret.example.yaml 不纳入 resources：真实 Secret 由集群侧创建，不入 Git。
images:
  - name: 18.183.238.1/forum/forum-gateway
    newTag: v1
  - name: 18.183.238.1/forum/forum-user-service
    newTag: v1
  - name: 18.183.238.1/forum/forum-content-service
    newTag: v1
  - name: 18.183.238.1/forum/forum-notification-service
    newTag: v1
  - name: 18.183.238.1/forum/forum-media-service
    newTag: v1
  - name: 18.183.238.1/forum/forum-weather-service
    newTag: v1
  - name: 18.183.238.1/forum/forum-frontend
    newTag: v2
